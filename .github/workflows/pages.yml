name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: vars.API_BASE_URL != ''
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify backend URL
        run: test -n "$VITE_API_BASE_URL" || (echo "Set the API_BASE_URL repository variable to your HTTPS backend URL." && exit 1)
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}

      - name: Build frontend
        run: npm run build
        env:
          VITE_BASE_PATH: /bacii-result-fbalbum-search/
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
